name: Deploy to Azure App Service

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: dcwebsystems-prod
  AZURE_CORE_OUTPUT: none
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: DCWS.MainSite.sln
  WEB_PROJECT_PATH: src/DCWS.MainSite.Web/DCWS.MainSite.Web.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  build-test-and-deploy:
    name: Build, test, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${SOLUTION_PATH}"

      - name: Build
        run: dotnet build "${SOLUTION_PATH}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${SOLUTION_PATH}" --configuration Release --no-build --no-restore

      - name: Publish web application
        run: >-
          dotnet publish "${WEB_PROJECT_PATH}"
          --configuration Release
          --no-build
          --no-restore
          --output "${PUBLISH_PATH}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
