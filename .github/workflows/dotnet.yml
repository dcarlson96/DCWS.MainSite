name: .NET build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DCWS.MainSite.sln

      - name: Build
        run: dotnet build DCWS.MainSite.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DCWS.MainSite.sln --configuration Release --no-build
